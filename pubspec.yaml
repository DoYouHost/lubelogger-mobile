name: lubelogger_mobile
description: "Native Android app for LubeLogger — a self-hosted vehicle maintenance manager."
publish_to: 'none'

version: 0.3.0+300000

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Used directly by the report relay client (SHA-256 for the proof of work).
  # Already resolved transitively; declared so the import is honest.
  crypto: ^3.0.6
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^16.0.0
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  fl_chart: ^1.2.0
  package_info_plus: ^9.0.1
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^22.0.1
  # Pinned to 8.x: file_picker 11.x's Android Kotlin module fails to link with
  # this project's Gradle/Flutter toolchain (GeneratedPluginRegistrant can't
  # resolve FilePickerPlugin). 8.x is stable here.
  file_picker: ^8.3.0
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  quick_actions: ^1.1.0
  flutter_slidable: ^4.0.3
  # Opens the issue URL the relay hands back, in the system browser.
  url_launcher: ^6.3.0
  # Manufacturer, model and API level for a bug report's session header. The
  # reminder check runs on WorkManager, and whether a background task survives is
  # decided by the OEM's battery manager — so "notifications never arrive" is
  # answered by the make of the phone more often than by anything in the code.
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/licenses/OFL-Manrope.txt
    - assets/licenses/OFL-JetBrainsMono.txt
    # Demo-mode vehicle photos (store-review mode; served offline as assets).
    - assets/demo/car_photo1.jpg
    - assets/demo/car_photo2.webp

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-600.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FCBD0E"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
