name: CI

# The "is it done?" signal for pull requests. Everything here is what `just test`
# plus a compile would tell you locally, so a green run means the branch builds
# and behaves; a red one is homework, not a question for the reviewer.
#
# Runs on the self-hosted runners (label `flutter`), which already carry the
# Flutter SDK, the Android SDK and a warm Gradle/pub cache — a hosted runner
# would spend most of the wall clock re-downloading them.
#
# Deliberately no formatting check: this project predates the tall-style
# formatter, so `dart format` rewrites dozens of files nobody touched and would
# fail every honest pull request.

on:
  pull_request:
    branches: [main]
    # Docs and the offline API reference can't break the build; skipping them
    # keeps the runner free for changes that can.
    paths-ignore:
      - "docs/**"
      - "reference/**"
      - "**/*.md"
  workflow_dispatch:

# A force-push should not leave the previous run burning a runner for a commit
# nobody will look at again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: analyze · test · build
    runs-on: [self-hosted, flutter]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Which SDK actually ran matters when a failure reproduces nowhere else.
      - name: Toolchain
        run: flutter --version

      # --enforce-lockfile, so a stale lock fails here instead of quietly
      # resolving something else. That is the failure this repository already
      # had: the lock was not committed, CI picked a newer workmanager_android
      # than any developer had, and the build died in the generated plugin
      # registrant with a class that does not exist.
      - name: Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # One flavour here, unlike bambuddy: this app ships a single APK.
      - name: Compile check
        run: flutter build apk --debug --target-platform android-arm64
