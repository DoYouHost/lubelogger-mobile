name: Pages

# The landing page and the privacy policy. They ship from `site/` on main, so a
# policy change is a normal commit reviewed alongside the code it describes,
# rather than a second branch to remember. The privacy policy URL below is
# registered in the Play Console — treat a broken deploy here as a live-listing
# problem, not a docs problem.
#
#   https://doyouhost.github.io/lubelogger-mobile/
#   https://doyouhost.github.io/lubelogger-mobile/privacy.html
#
# The deploy itself is shared with bambuddy-mobile; only the trigger below is
# ours. Pinned to `master` until app-shared cuts a tag that carries it.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Pages deployments are stateful, so a queued run must not overtake a running
# one. In-progress runs finish rather than being cancelled: a half-applied
# deploy would take the policy URL down.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: DoYouHost/app-shared/.github/workflows/pages.yml@master
    permissions:
      pages: write
      id-token: write
