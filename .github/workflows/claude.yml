name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.perm.outputs.allowed }}
    steps:
      - id: perm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.event.comment.user.login || github.event.review.user.login || github.event.issue.user.login }}
        run: |
          LEVEL=$(gh api "repos/${{ github.repository }}/collaborators/$ACTOR/permission" -q .permission 2>/dev/null || echo none)
          echo "$ACTOR has permission: $LEVEL"
          if [[ "$LEVEL" == "admin" || "$LEVEL" == "write" ]]; then
            echo "allowed=true" >>"$GITHUB_OUTPUT"
          else
            echo "allowed=false" >>"$GITHUB_OUTPUT"
          fi

  claude:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: [self-hosted, flutter]
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fetch LubeLogger server reference
        run: |
          rm -rf /tmp/lubelog-server-ref
          git clone --depth 1 --single-branch \
            https://github.com/hargata/lubelog.git /tmp/lubelog-server-ref

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5
            --effort medium
            --add-dir /tmp/lubelog-server-ref
            --allowedTools
            "Bash(flutter analyze:*)" "Bash(flutter test:*)" "Bash(just test)"
            "Bash(flutter pub get:*)" "Bash(flutter gen-l10n:*)"
            "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)"
            "Bash(gh run list:*)" "Bash(gh run view:*)" "Bash(gh pr view:*)" "Bash(gh pr diff:*)" "Bash(gh issue view:*)"
            "mcp__github_inline_comment__create_inline_comment" "Bash(gh pr comment:*)"
            "Bash(curl -sL https://raw.githubusercontent.com/DoYouHost/lubelogger-mobile/bug-report-assets/*)" "Bash(zcat:*)" "Bash(gunzip:*)"
            "WebSearch" "WebFetch(domain:pub.dev)" "WebFetch(domain:docs.lubelogger.com)"

      - name: Remove LubeLogger server reference
        if: always()
        run: rm -rf /tmp/lubelog-server-ref
