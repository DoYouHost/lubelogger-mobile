name: Claude Code

# The permission gate, the runner setup and the tool allowlist are shared with
# bambuddy-mobile; what is here is the trigger, the server reference and the one
# tool only this app grants. Pinned to `master` until app-shared cuts a tag that
# carries it.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    uses: DoYouHost/app-shared/.github/workflows/claude.yml@master
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    with:
      server_ref_url: https://github.com/hargata/lubelog.git
      server_ref_dir: /tmp/lubelog-server-ref
      extra_allowed_tools: '"WebFetch(domain:docs.lubelogger.com)"'
    secrets:
      claude_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
